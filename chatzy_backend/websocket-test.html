<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebSocket STOMP Test</title>
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        .section {
            margin-bottom: 20px;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        input {
            width: 100%;
            padding: 8px;
            margin: 5px 0;
            box-sizing: border-box;
        }
        button {
            padding: 10px 20px;
            margin: 5px 0;
            cursor: pointer;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
        }
        button:hover {
            background: #0056b3;
        }
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        #messages {
            height: 300px;
            overflow-y: auto;
            background: #f5f5f5;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        .message {
            margin: 5px 0;
            padding: 5px;
            background: white;
            border-left: 3px solid #007bff;
        }
        .status {
            font-weight: bold;
            margin: 10px 0;
        }
        .connected { color: green; }
        .disconnected { color: red; }
    </style>
</head>
<body>
    <h1>WebSocket STOMP Test Client</h1>

    <div class="section">
        <h3>Connection</h3>
        <input type="text" id="jwtToken" placeholder="Enter your JWT token" />
        <button id="connectBtn" onclick="connect()">Connect</button>
        <button id="disconnectBtn" onclick="disconnect()" disabled>Disconnect</button>
        <div id="status" class="status disconnected">Status: Disconnected</div>
    </div>

    <div class="section">
        <h3>Send Message via REST API</h3>
        <input type="text" id="chatId" placeholder="Chat ID (UUID)" />
        <input type="text" id="senderId" placeholder="Sender ID (UUID)" />
        <input type="text" id="recipientId" placeholder="Recipient ID (UUID)" />
        <input type="text" id="content" placeholder="Message content" />
        <button onclick="sendMessage()">Send Message</button>
    </div>

    <div class="section">
        <h3>Received Messages</h3>
        <div id="messages"></div>
    </div>

    <script>
        let stompClient = null;
        let connected = false;

        function connect() {
            const jwtToken = document.getElementById('jwtToken').value;
            if (!jwtToken) {
                alert('Please enter your JWT token');
                return;
            }

            const socket = new SockJS('http://localhost:8080/ws-chat');
            stompClient = Stomp.over(socket);

            const headers = {
                'Authorization': 'Bearer ' + jwtToken
            };

            stompClient.connect(headers, function (frame) {
                connected = true;
                updateStatus(true);
                document.getElementById('connectBtn').disabled = true;
                document.getElementById('disconnectBtn').disabled = false;

                console.log('Connected: ' + frame);

                // Subscribe to receive messages
                stompClient.subscribe('/user/queue/messages', function (message) {
                    const msg = JSON.parse(message.body);
                    showMessage('Received: ' + JSON.stringify(msg, null, 2));
                });

            }, function (error) {
                connected = false;
                updateStatus(false);
                console.error('Connection error: ' + error);
                showMessage('Connection error: ' + error);
            });
        }

        function disconnect() {
            if (stompClient && connected) {
                stompClient.disconnect(function () {
                    connected = false;
                    updateStatus(false);
                    document.getElementById('connectBtn').disabled = false;
                    document.getElementById('disconnectBtn').disabled = true;
                    console.log('Disconnected');
                });
            }
        }

        function sendMessage() {
            const chatId = document.getElementById('chatId').value;
            const senderId = document.getElementById('senderId').value;
            const recipientId = document.getElementById('recipientId').value;
            const content = document.getElementById('content').value;

            if (!chatId || !senderId || !recipientId || !content) {
                alert('Please fill all fields');
                return;
            }

            const messageData = {
                chatId: chatId,
                senderId: senderId,
                recipientId: recipientId,
                content: content,
                type: 'TEXT'
            };

            fetch('http://localhost:8080/api/messages/send', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + document.getElementById('jwtToken').value
                },
                body: JSON.stringify(messageData)
            })
            .then(response => response.json())
            .then(data => {
                showMessage('Message sent via REST: ' + JSON.stringify(data, null, 2));
            })
            .catch(error => {
                showMessage('Error sending message: ' + error);
            });
        }

        function showMessage(msg) {
            const messagesDiv = document.getElementById('messages');
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message';
            messageDiv.textContent = msg;
            messagesDiv.appendChild(messageDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function updateStatus(isConnected) {
            const statusDiv = document.getElementById('status');
            if (isConnected) {
                statusDiv.textContent = 'Status: Connected';
                statusDiv.className = 'status connected';
            } else {
                statusDiv.textContent = 'Status: Disconnected';
                statusDiv.className = 'status disconnected';
            }
        }
    </script>
</body>
</html>
