spring.application.name=chatzy_backend

# Database Connection Settings
spring.datasource.url=jdbc:postgresql://localhost:5432/chatzy
spring.datasource.username=postgres
spring.datasource.password=your_db_password_here

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# JWT Token Secret
jwt.secret=lkadsjf;i34jfksdajfk89539843949u589up9ewr90845

# ===== IMPORTANT: SET YOUR GOOGLE OAUTH2 CREDENTIALS HERE =====
# Get these from Google Cloud Console: https://console.cloud.google.com/
# Steps:
# 1. Create OAuth 2.0 Client ID (Web Application)
# 2. Add redirect URI: http://localhost:8080/login/oauth2/code/google
# 3. Copy Client ID and Client Secret below

spring.security.oauth2.client.registration.google.client-id=YOUR_CLIENT_ID_HERE
spring.security.oauth2.client.registration.google.client-secret=YOUR_CLIENT_SECRET_HERE
spring.security.oauth2.client.registration.google.scope=openid,profile,email,https://www.googleapis.com/auth/contacts.readonly
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/google

# Redis Configuration
spring.data.redis.host=localhost
spring.data.redis.port=6379

# JPA Settings
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

# Logging
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web.servlet.mvc.method.annotation.RequestMappingHandlerMapping=DEBUG

