spring.application.name=chatzy_backend

# --- Database Configuration ---
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# --- Flyway Migrations ---
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# --- Security & JWT ---
jwt.secret=${Jwt_Token}

logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web.servlet.mvc.method.annotation.RequestMappingHandlerMapping=DEBUG

# --- Google OAuth2 & Contacts API ---
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email,https://www.googleapis.com/auth/contacts.readonly
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/google

# --- Redis Configuration ---
spring.data.redis.host=localhost
spring.data.redis.port=6379

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

# --- AWS S3 Configuration ---
aws.region=ap-south-1
aws.accessKeyId=${AWS_ACCESS_KEY_ID}
aws.secretAccessKey=${AWS_SECRET_ACCESS_KEY}
aws.s3.bucket=chatzy-avatar

# --- Email Configuration ---
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com

# --- OTP Configuration ---
otp.expiration.minutes=10
otp.length=6

# --- Frontend URL ---
app.frontend.url=http://localhost:3000

# --- WebRTC Configuration ---
webrtc.ice-servers[0].urls=stun:your-stun-server.com:3478
webrtc.ice-servers[1].urls=turn:your-turn-server.com:3478
webrtc.ice-servers[1].username=username
webrtc.ice-servers[1].credential=credential

# --- Server Settings ---
server.address=0.0.0.0